<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="100%" stop-color="#121f24"/>
    </linearGradient>
    <linearGradient id="pickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.3"/>

  <!-- High-Precision Timing Calibration Dial / Clock -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#00bbf9" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Voxel Automation Block Geometry (Center Isometric) -->
  <polygon points="250,110 360,175 250,240 140,175" fill="#132a32" stroke="url(#pickGrad)" stroke-width="3"/>
  <polygon points="140,175 250,240 250,360 140,295" fill="#0c1d23" stroke="url(#pickGrad)" stroke-width="3"/>
  <polygon points="360,175 250,240 250,360 360,295" fill="#193843" stroke="url(#pickGrad)" stroke-width="3"/>

  <!-- Out-of-Process Sniffer Antenna / Packet Tap Lightning Bolt -->
  <polygon points="255,145 235,190 255,190 245,230 275,180 255,180" fill="#ffd166" filter="url(#glow)"/>

  <!-- Hardware HID Clicker Precision Target Crosshair -->
  <line x1="250" y1="220" x2="250" y2="280" stroke="#00f5d4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="220" y1="250" x2="280" y2="250" stroke="#00f5d4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="12" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glow)"/>

  <!-- Gaussian-Weibull Jitter Distribution Sparkles -->
  <circle cx="210" cy="235" r="4" fill="#00f5d4"/>
  <circle cx="280" cy="230" r="3" fill="#ffd166"/>
  <circle cx="290" cy="265" r="4" fill="#00f5d4"/>
  <circle cx="215" cy="270" r="3" fill="#ff0055"/>
</svg>
